<!DOCTYPE html> 
<html lang="es"> 
    <head> 
        <meta charset="utf-8"> 
        <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
        <meta name="viewport" content="width=device-width, initial-scale=1"> 
        <meta name="description" content=""> 
        <meta name="author" content=""> 
        <title>Listar Usuarios</title>         
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Archivo&display=swap">
        <!-- Datatables CSS -->
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.2/css/dataTables.bootstrap5.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.3.4/css/buttons.bootstrap5.min.css">
        <!-- Datatables JS -->
        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script src="https://cdn.datatables.net/1.13.2/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.2/js/dataTables.bootstrap5.min.js"></script>
        <!-- Datatables Buttons -->
        <script src="https://cdn.datatables.net/buttons/2.3.4/js/dataTables.buttons.min.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.bootstrap5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.html5.min.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.print.min.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.3.4/js/buttons.colVis.min.js"></script>
        <script>
        $(document).ready(function() {
            var table = $('#example').DataTable({
                dom: 'frBltip',
                pageLength: 25,
                language: {"url": "//cdn.datatables.net/plug-ins/9dcbecd42ad/i18n/Spanish.json"},
                responsive: true,
                autoWidth: false,
                lengthChange: false,
                buttons: ['excel', 'pdf', 'colvis']
            });

            table.buttons().container().appendTo('#example_wrapper .col-md-6:eq(0)');
        });
    </script>
    </head>     
    <body>
        <div class="card" style="margin-left: 50px; margin-right: 50px; margin-top: 100px;">
            <div class="card-header" style="font-family: 'Archivo', sans-serif; font-size: 25px;">
                Listado de Usuarios
</div>
            <div class="card-body"> 
                <table id="example" class="display responsive nowrap table table-striped" style="width:100%"> 
                    <thead> 
                        <tr> 
                            <th>ID</th> 
                            <th>Titulo</th> 
                            <th>Contenido</th> 
                            <th>Autor</th> 
                            <th>Fecha</th>
                            <th>Categoría</th>
                            <th>Etiqueta</th> 
                            <th>Acción</th> 
                        </tr>                         
                    </thead>                     
                    <tbody> 
                        <tr> 
                            <td>Tiger Nixon</td> 
                            <td>System Architect</td> 
                            <td>Edinburgh</td> 
                            <td>61</td> 
                            <td>2011-04-25</td>
                            <td>2011-04-25</td>
                            <td>2011-04-25</td> 
                            <td class="text-center">
                                <button type="button" class="border-0 btn btn-sm m-0 p-0 text-warning">
                                    <i class="fa-edit fa-fw far" title="Editar"></i>
                                </button>
                                <button type="button" class="border-0 btn btn-sm mb-0 me-0 ms-2 mt-0 p-0">
                                    <i class="fa-fw fa-trash-alt far text-danger" title="Borrar"></i>
                                </button>
                            </td>                             
                        </tr>                         
                    </tbody>                     
                </table>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    </body>     
</html>
