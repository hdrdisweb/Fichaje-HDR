<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Crear Usuario</title>         
        <!-- Bootstrap CSS -->         
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
        <!-- FontAwesome -->         
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"> 
        <!-- Custom CSS -->         
        <style>
        .card {
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .btn-eye {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>         
    </head>     
    <body> 
        <div class="container mt-5"> 
            <div class="card shadow"> 
                <div class="card-body"> 
                    <h3 class="card-title text-center mb-4">Crear Usuario</h3> 
                    <form> 
                        <!-- Línea 1: Nombre, Apellido, DNI -->                         
                        <div class="row mb-3"> 
                            <div class="col-md-4"> 
                                <label for="nombre" class="form-label">Nombre</label>                                 
                                <input type="text" class="form-control" id="nombre" name="nombre" required> 
                            </div>                             
                            <div class="col-md-4"> 
                                <label for="apellido" class="form-label">Apellido</label>                                 
                                <input type="text" class="form-control" id="apellido" name="apellido" required> 
                            </div>                             
                            <div class="col-md-4"> 
                                <label for="dni" class="form-label">DNI/NIE/NIF</label>                                 
                                <input type="text" class="form-control" id="dni" name="dni"> 
                            </div>                             
                        </div>                         
                        <!-- Línea 2: Dirección, Teléfono, Estado -->                         
                        <div class="row mb-3"> 
                            <div class="col-md-4"> 
                                <label for="direccion" class="form-label">Dirección</label>                                 
                                <input type="text" class="form-control" id="direccion" name="direccion"> 
                            </div>                             
                            <div class="col-md-4"> 
                                <label for="telefono" class="form-label">Teléfono</label>                                 
                                <input type="text" class="form-control" id="telefono" name="telefono"> 
                            </div>                             
                            <div class="col-md-4"> 
                                <label for="estado" class="form-label">Estado</label>                                 
                                <select class="form-select" id="estado" name="estado"> 
                                    <option value="activo" selected>Activo</option>                                     
                                    <option value="inactivo">Inactivo</option>                                     
                                </select>                                 
                            </div>                             
                        </div>                         
                        <!-- Línea 3: Rol, Email, Contraseña -->                         
                        <div class="row mb-3"> 
                            <div class="col-md-4"> 
                                <label for="rol" class="form-label">Rol</label>                                 
                                <select class="form-select" id="rol" name="rol"> 
                                    <option value="usuario" selected>Usuario</option>                                     
                                    <option value="jefe">Jefe</option>                                     
                                    <option value="admin">Administrador</option>                                     
                                </select>                                 
                            </div>                             
                            <div class="col-md-4"> 
                                <label for="email" class="form-label">Email</label>                                 
                                <input type="email" class="form-control" id="email" name="email" required> 
                            </div>                             
                            <div class="col-md-4 position-relative"> 
                                <label for="password" class="form-label">Contraseña</label>                                 
                                <input type="password" class="form-control" id="password" name="password" required> <i class="fa fa-eye btn-eye" id="toggle-password"></i> 
                            </div>                             
                        </div>                         
                        <!-- Línea 4: Avatar, Notas -->                         
                        <div class="row mb-3"> 
                            <div class="col-md-6"> 
                                <label for="avatar" class="form-label">Avatar</label>                                 
                                <input type="file" class="form-control" id="avatar" name="avatar"> 
                            </div>                             
                            <div class="col-md-6"> 
                                <label for="nota" class="form-label">Nota</label>                                 
                                <textarea class="form-control" id="nota" name="nota" rows="3"></textarea> 
                            </div>                             
                        </div>                         
                        <!-- Botones -->                         
                        <div class="text-center"> 
                            <button type="submit" class="btn btn-primary">Crear Usuario</button>                             
                            <button type="reset" class="btn btn-secondary">Limpiar</button>                             
                        </div>                         
                    </form>                     
                </div>                 
            </div>             
        </div>         
        <!-- Bootstrap JS -->         
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>         
        <!-- FontAwesome -->         
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>         
        <script>
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const type = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = type;
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>         
    </body>     
</html>
